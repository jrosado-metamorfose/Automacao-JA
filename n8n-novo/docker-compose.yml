version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-producao
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_dados_novos:/home/node/.local/share/n8n

volumes:
  n8n_dados_novos:
